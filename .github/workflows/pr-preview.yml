name: PR preview artifacts

# Builds pre.js / post.js for pull requests opened from a branch in this
# repository and publishes them twice: as a workflow artifact on the run, and as
# a `pr-<number>` prerelease whose asset URLs stay stable while the PR is open,
# so a test runner's wrapper can point at them. The prerelease is replaced on
# every push to the PR and deleted when the PR closes. A preview can also be
# rebuilt on demand with "Run workflow" and the PR number.
#
# Previews are unreviewed code: the release notes and the PR comment say so.
#
# The token is kept away from PR code: the build job runs with a read-only
# token and without persisting credentials, and only the publish job, which
# checks nothing out and runs no project code, has write access.
#
# Pull requests from forks are skipped: their token is read-only, and code that
# a repository writer has not pushed should not be published here.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to rebuild the preview for
        required: true
        type: number

permissions: {}

concurrency:
  group: pr-preview-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  context:
    # Resolves the PR to build from either trigger, so the other jobs do not
    # care how they were started.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      url: ${{ steps.pr.outputs.url }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_NUMBER: ${{ inputs.pr_number }}
        run: |
          number="${EVENT_NUMBER:-$INPUT_NUMBER}"
          gh pr view "$number" --json number,headRefOid,headRepository,headRepositoryOwner,url,state \
            --jq '"number=\(.number)\nhead_sha=\(.headRefOid)\nhead_repo=\(.headRepositoryOwner.login)/\(.headRepository.name)\nurl=\(.url)\nstate=\(.state)"' \
            | tee -a "$GITHUB_OUTPUT"

  build:
    needs: context
    if: needs.context.outputs.head_repo == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.context.outputs.head_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Test
        run: npm run test

      - name: Build preview artifacts
        env:
          PREVIEW_TAG: pr-${{ needs.context.outputs.number }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
        run: |
          printf 'export const HookVersion = "%s";\n' "${PREVIEW_TAG}-${HEAD_SHA::7}" > src/version.ts
          npm run build
          cat dist/checksums.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hooks-pr-${{ needs.context.outputs.number }}-${{ needs.context.outputs.head_sha }}
          path: |
            dist/pre.js
            dist/post.js
            dist/checksums.txt
          if-no-files-found: error

  publish:
    # No checkout and no project code here: this is the only job with a write
    # token.
    needs: [context, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ needs.context.outputs.number }}
      PREVIEW_TAG: pr-${{ needs.context.outputs.number }}
      HEAD_SHA: ${{ needs.context.outputs.head_sha }}
      PR_URL: ${{ needs.context.outputs.url }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Download built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hooks-pr-${{ needs.context.outputs.number }}-${{ needs.context.outputs.head_sha }}
          path: dist

      # Replace the previous preview so the tag follows the PR head. Only a
      # missing release is tolerated; any other failure stops the job.
      - name: Publish preview prerelease
        run: |
          if gh release view "${PREVIEW_TAG}" >/dev/null 2>&1; then
            gh release delete "${PREVIEW_TAG}" --cleanup-tag --yes
          fi
          gh release create "${PREVIEW_TAG}" \
            --prerelease \
            --target "${HEAD_SHA}" \
            --title "Preview build for PR #${PR_NUMBER} (unreviewed)" \
            --notes "UNREVIEWED preview build of ${PR_URL} at ${HEAD_SHA}, for testing only. Not for production use. Replaced on every push to the PR and removed when it closes." \
            dist/pre.js#pre.js \
            dist/post.js#post.js \
            dist/checksums.txt#checksums.txt

      - name: Comment asset URLs on the PR
        env:
          SERVER_URL: ${{ github.server_url }}
        run: |
          base="${SERVER_URL}/${GH_REPO}/releases/download/${PREVIEW_TAG}"
          {
            echo "**Unreviewed preview hook build** for ${HEAD_SHA::7}, for testing only. Replaced on every push, removed when the PR closes."
            echo
            echo "- ${base}/pre.js"
            echo "- ${base}/post.js"
            echo "- ${base}/checksums.txt"
            echo
            echo '```'
            cat dist/checksums.txt
            echo '```'
          } > comment.md
          gh pr comment "${PR_NUMBER}" --body-file comment.md --edit-last --create-if-none

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PREVIEW_TAG: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Remove preview prerelease
        run: |
          if gh release view "${PREVIEW_TAG}" >/dev/null 2>&1; then
            gh release delete "${PREVIEW_TAG}" --cleanup-tag --yes
          else
            echo "no preview release to remove"
          fi
